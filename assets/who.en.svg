<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif" role="img">
<rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="#F7F5F0" stroke="#D8D4CC"/>
<text x="600" y="42" font-size="22" fill="#1F2430" font-weight="700" text-anchor="middle">Who makes what</text>
<rect x="60" y="70" width="340" height="230" rx="14" fill="#FFFFFF" stroke="#D8D4CC"/>
<rect x="60" y="70" width="340" height="10" rx="5" fill="#1F9D6B"/>
<text x="82" y="120" font-size="21" fill="#1F9D6B" font-weight="700" text-anchor="start">The browser draws</text>
<circle cx="90" cy="155" r="5" fill="#1F9D6B"/>
<text x="106" y="160" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">All text, sharp and correct</text>
<circle cx="90" cy="197" r="5" fill="#1F9D6B"/>
<text x="106" y="202" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Layout, shapes, simple marks</text>
<circle cx="90" cy="239" r="5" fill="#1F9D6B"/>
<text x="106" y="244" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Charts and diagrams</text>
<rect x="430" y="70" width="340" height="230" rx="14" fill="#FFFFFF" stroke="#D8D4CC"/>
<rect x="430" y="70" width="340" height="10" rx="5" fill="#2F6FDE"/>
<text x="452" y="120" font-size="21" fill="#2F6FDE" font-weight="700" text-anchor="start">You supply</text>
<circle cx="460" cy="155" r="5" fill="#2F6FDE"/>
<text x="476" y="160" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Screenshots and product photos</text>
<circle cx="460" cy="197" r="5" fill="#2F6FDE"/>
<text x="476" y="202" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Numbers and claims</text>
<circle cx="460" cy="239" r="5" fill="#2F6FDE"/>
<text x="476" y="244" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Logos and brand colors</text>
<rect x="800" y="70" width="340" height="230" rx="14" fill="#FFFFFF" stroke="#D8D4CC"/>
<rect x="800" y="70" width="340" height="10" rx="5" fill="#7048E8"/>
<text x="822" y="120" font-size="21" fill="#7048E8" font-weight="700" text-anchor="start">An image tool, if you want one</text>
<circle cx="830" cy="155" r="5" fill="#7048E8"/>
<text x="846" y="160" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">Text-free backgrounds only</text>
<circle cx="830" cy="197" r="5" fill="#7048E8"/>
<text x="846" y="202" font-size="17" fill="#1F2430" font-weight="400" text-anchor="start">With a clear zone for the text</text>
<text x="600" y="350" font-size="19" fill="#5B6270" font-weight="600" text-anchor="middle">Words never go through an image model, and real things are never redrawn.</text>
</svg>
